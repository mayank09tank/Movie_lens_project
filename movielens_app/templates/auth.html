<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MovieLens — {{ "Sign Up" if tab == "signup" else "Login" }}</title>
<link rel="stylesheet" href="/static/css/style.css?v=7">
</head>
<body>

<canvas id="flow-canvas"></canvas>
<div class="bg-image"></div>

<div class="auth-page">
  <div class="auth-box">

    <div class="auth-logo">
      <div class="brand" style="justify-content:center;font-size:1.9rem;">
        🎬 <span style="font-weight:900;letter-spacing:3px;color:#fff;">CINE<span style="color:var(--red);">LENS</span></span>
      </div>
      <p>Your Movie Universe</p>
    </div>

    <div class="auth-tabs">
      <a href="/login"  class="auth-tab {{ 'active' if tab == 'login'  else '' }}">Login</a>
      <a href="/signup" class="auth-tab {{ 'active' if tab == 'signup' else '' }}">Sign Up</a>
    </div>

    {% if error %}
    <div class="msg-error">⚠️ {{ error }}</div>
    {% endif %}

    {% if success is defined and success %}
    <div class="msg-success">✅ {{ success }}</div>
    {% endif %}

    {% if tab == "login" %}
    <form method="POST" action="/login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
      </div>
      <a href="#" class="forgot">Forgot password?</a>
      <button type="submit" class="btn-auth">Login →</button>
    </form>
    <div class="auth-footer">Don't have an account? <a href="/signup">Sign Up</a></div>

    {% else %}
    <form method="POST" action="/signup">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Your full name" required autocomplete="name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min 6 characters" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm" placeholder="Repeat your password" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn-auth">Create Account →</button>
    </form>
    <div class="auth-footer">Already have an account? <a href="/login">Login</a></div>
    {% endif %}

  </div>
</div>

<script src="/static/js/flow-bg.js"></script>
</body>
</html>
